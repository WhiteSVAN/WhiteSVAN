# Local Postgres for development. `docker compose up -d` then `npm run db:migrate`.
services:
  db:
    image: postgres:16
    container_name: quantidive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quantidive
      POSTGRES_PASSWORD: quantidive
      POSTGRES_DB: quantidive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
